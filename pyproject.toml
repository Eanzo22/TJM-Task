[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fakturama-image-to-cash"
version = "0.1.0"
description = "Guarded image-to-Order-to-linked-Invoice Windows automation prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "Pillow>=11,<13", "pywinauto==0.6.9; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ocr = [
  "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
]

[project.scripts]
fakturama-cash = "fakturama_cash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
